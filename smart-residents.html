<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Resident | Property & Resident Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Maoka Residence & Smart Resident</h1>
    <p>Property Listings, Tenant Applications, and Landlord Management</p>
  </header>

  <main>
    <!-- SECTION 1: PUBLIC PROPERTY LISTINGS GRID -->
    <section class="card">
      <h2>Available Properties</h2>
      <div id="listingsContainer">
        <p>Loading active listings...</p>
      </div>
    </section>

    <!-- SECTION 2: LANDLORD REGISTRATION FORM -->
    <section class="card">
      <h2>Landlord Profile Registration</h2>
      <form id="landlordRegisterForm" onsubmit="registerLandlordForm(event)">
        <div class="form-group">
          <label for="regUsername">Username:</label>
          <input type="text" id="regUsername" name="username" required autocomplete="username" placeholder="e.g. jsmith">
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address:</label>
          <input type="email" id="regEmail" name="email" required autocomplete="email" placeholder="landlord@example.com">
        </div>

        <div class="form-group">
          <label for="regPhone">Phone Number:</label>
          <input type="tel" id="regPhone" name="phone" required autocomplete="tel" placeholder="0821234567">
        </div>

        <div class="form-group">
          <label for="regPassword">Password:</label>
          <input type="password" id="regPassword" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password:</label>
          <input type="password" id="regConfirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Re-enter password">
        </div>

        <button type="submit" class="btn-primary">Register Landlord Account</button>
      </form>
      <div id="registerStatus" class="status-box"></div>
    </section>

    <!-- SECTION 3: ADD NEW PROPERTY LISTING (LANDLORD) -->
    <section class="card">
      <h2>Add Property Listing (Landlords)</h2>
      <form id="listingForm" onsubmit="submitNewListingForm(event)">
        <div class="form-group">
          <label for="listTitle">Property Title:</label>
          <input type="text" id="listTitle" name="title" required placeholder="e.g. Modern Studio Unit">
        </div>

        <div class="form-group">
          <label for="listLocation">Location / Unit Number:</label>
          <input type="text" id="listLocation" name="location" required placeholder="e.g. Midrand">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="listRent">Monthly Rent (ZAR):</label>
            <input type="number" id="listRent" name="rentAmount" required placeholder="4500">
          </div>
          <div class="form-group">
            <label for="listDeposit">Deposit Required (ZAR):</label>
            <input type="number" id="listDeposit" name="deposit" required placeholder="4500">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="listBedrooms">Bedrooms:</label>
            <input type="number" id="listBedrooms" name="bedrooms" value="1" min="0">
          </div>
          <div class="form-group">
            <label for="listBathrooms">Bathrooms:</label>
            <input type="number" id="listBathrooms" name="bathrooms" value="1" min="1">
          </div>
        </div>

        <div class="form-group">
          <label for="listDescription">Description:</label>
          <textarea id="listDescription" name="description" rows="3" placeholder="Describe features, amenities, prepaid utilities, etc."></textarea>
        </div>

        <div class="form-group">
          <label for="propertyPhotos">Upload Property Photos:</label>
          <input type="file" id="propertyPhotos" name="propertyPhotos" accept="image/*" multiple>
        </div>

        <button type="submit" class="btn-primary">Publish Property Listing</button>
      </form>
      <div id="listingFormStatus" class="status-box"></div>
    </section>

    <!-- SECTION 4: TENANT APPLICATION FORM -->
    <section class="card">
      <h2>Tenant Online Application</h2>
      <form id="applicationForm" onsubmit="submitTenantForm(event)">
        <div class="form-group">
          <label for="appFullName">Full Name:</label>
          <input type="text" id="appFullName" name="fullName" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="appIdNumber">ID or Passport Number:</label>
          <input type="text" id="appIdNumber" name="idNumber" required placeholder="National ID or Passport Number">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="appEmail">Email Address:</label>
            <input type="email" id="appEmail" name="email" required placeholder="tenant@example.com">
          </div>
          <div class="form-group">
            <label for="appPhone">Phone Number:</label>
            <input type="tel" id="appPhone" name="phone" required placeholder="0821234567">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="appEmployment">Employment Status:</label>
            <input type="text" id="appEmployment" name="employmentStatus" placeholder="e.g. Employed / Self-Employed">
          </div>
          <div class="form-group">
            <label for="appIncome">Gross Monthly Income (ZAR):</label>
            <input type="number" id="appIncome" name="monthlyIncome" placeholder="e.g. 15000">
          </div>
        </div>

        <div class="form-group">
          <label for="appMoveDate">Preferred Move-in Date:</label>
          <input type="date" id="appMoveDate" name="moveInDate">
        </div>

        <div class="form-group">
          <label for="idDocumentFile">Upload ID / Passport Document (Image or PDF):</label>
          <input type="file" id="idDocumentFile" name="idDocument" accept="image/*,application/pdf">
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="popiaConsent" required>
            I consent to the collection and processing of personal data for background verification in compliance with POPIA.
          </label>
        </div>

        <button type="submit" class="btn-primary">Submit Tenant Application</button>
      </form>
      <div id="formStatus" class="status-box"></div>
    </section>
  </main>

  <!-- External Script Connector containing the API bindings -->
  <script src="smart-residents.js"></script>
</body>
</html>
